<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#7a68e8">
<title>abchat · Secure Messenger</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ac:#00f2fe;--ac2:#4facfe;--fs:15px}
body{--l1:#051c30;--l2:#01070d;--cardbg:rgba(5,28,48,.88);--rpa:#053055;--rpb:#020b14;--bg:#020b14;--pn:#051422;--pn2:#0a2238;--tx:#f0f9ff;--mu:#8aa8c1;--bd:rgba(0,242,254,.18);--in:#0e2a44;--ink:#01060b;font:var(--fs)/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;overflow:hidden}
body.soft{--bg:#f7f4ff;--pn:#fff;--pn2:#efeaff;--tx:#241b3d;--mu:#7b7396;--bd:rgba(139,123,255,.28);--in:#fff;--ink:#fff;--l1:#fff;--l2:#e2d9ff;--cardbg:rgba(255,255,255,.93);--rpa:#7a68e8;--rpb:#5b49c9}
body.light{--bg:#f0f6fc;--pn:#fff;--pn2:#e5eff7;--tx:#091a2a;--mu:#52718a;--bd:rgba(0,120,180,.2);--in:#fff}
body.amoled{--bg:#000;--pn:#06080a;--pn2:#101418;--in:#141a20}
button{border:0;background:none;color:inherit;font:inherit;cursor:pointer}input{font:inherit;color:inherit}
small{color:var(--mu);font-size:12px;display:block}b{font-weight:600}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.h{display:none!important}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:6px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:perspective(700px) rotateX(-35deg) translateY(18px) scale(.92)}}
@keyframes rot{to{transform:rotate(360deg)}}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);transition:opacity .5s}#splash.x{opacity:0;pointer-events:none}
.lg{width:88px;height:88px;border-radius:28px;border:1.5px solid var(--ac);display:grid;place-items:center;color:var(--ac);box-shadow:0 0 50px -6px var(--ac);animation:pulse 1.6s ease-in-out infinite}.lg svg{width:42px;height:42px}
@keyframes pulse{50%{transform:perspective(500px) rotateY(180deg) scale(1.08);box-shadow:0 0 80px -4px var(--ac)}}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--pn2);color:var(--mu);border:1px solid transparent;transition:.25s;flex-shrink:0}
.ib:hover{color:var(--ac);border-color:var(--bd);transform:translateY(-2px);box-shadow:0 8px 18px -8px var(--ac)}.ib:active{transform:scale(.9)}
.pr{height:46px;border-radius:999px;width:100%;font-weight:600;color:var(--ink);background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 0 24px -6px var(--ac);transition:.25s;position:relative;overflow:hidden}
.pr:hover{transform:translateY(-2px);box-shadow:0 8px 28px -4px var(--ac)}.pr:active{transform:scale(.97)}.pr:disabled{opacity:.4;transform:none;box-shadow:none;cursor:not-allowed}
.gb{background:#fff;color:#1f2937;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 0 24px -6px var(--ac)}
.spin{width:16px;height:16px;border:2.5px solid rgba(0,0,0,.25);border-top-color:#000;border-radius:50%;animation:rot .7s linear infinite;display:inline-block;margin-right:8px;vertical-align:-3px}
.rip{position:absolute;border-radius:50%;background:rgba(0,0,0,.2);transform:scale(0);animation:rp .55s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(3);opacity:0}}
.inp{width:100%;height:44px;border-radius:999px;border:1px solid var(--bd);background:var(--pn2);padding:0 16px;outline:0;transition:.25s}
.inp:focus{border-color:var(--ac);box-shadow:0 0 16px -4px var(--ac)}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1.5px solid var(--ac);flex-shrink:0;background:var(--pn2)}

#login{position:fixed;inset:0;z-index:20;display:grid;place-items:center;perspective:1200px;background:radial-gradient(circle at 50% 40%,var(--l1),var(--l2) 72%);overflow:hidden}
#fx{position:absolute;inset:0;width:100%;height:100%}
#card{position:relative;width:min(860px,92vw);height:430px;border:1px solid var(--bd);background:rgba(5,28,48,.75);backdrop-filter:blur(12px);box-shadow:0 0 30px rgba(0,242,254,.15),inset 0 0 40px -20px var(--ac);transform-style:preserve-3d;transition:transform .2s ease-out;animation:cin 1.1s cubic-bezier(.2,.9,.3,1) backwards;color:var(--tx)}
@keyframes cin{from{opacity:0;transform:rotateX(60deg) translateZ(-320px) translateY(90px)}}
.lp{position:absolute;left:0;top:0;bottom:0;width:54%;padding:0 42px;display:flex;flex-direction:column;justify-content:center;gap:14px;z-index:2}
.lp h2{font-size:32px;font-weight:700}.lp .tg{color:var(--mu);font-size:13px}
.tc{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--mu);cursor:pointer;user-select:none}
.tc input{display:none}.tc i{width:20px;height:20px;border:1.5px solid var(--ac);border-radius:6px;display:grid;place-items:center;transition:.25s;flex-shrink:0}
.tc input:checked+i{background:var(--ac);box-shadow:0 0 12px var(--ac)}.tc input:checked+i::after{content:"";width:5px;height:10px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tc u{color:var(--ac);font-weight:600;cursor:pointer}
#lerr{color:#ff5252;font-size:12px;min-height:16px}
.rpw{position:absolute;inset:0;filter:drop-shadow(0 0 2px var(--ac));pointer-events:none}
.rp{position:absolute;inset:0;clip-path:polygon(33% 0,100% 0,100% 100%,83% 100%);background:linear-gradient(225deg,var(--ac),var(--rpa) 40%,var(--rpb) 95%)}
.rt{color:#fff;position:absolute;right:6%;top:52%;transform:translateY(-50%);text-align:right;width:34%}
.rt h3{font-size:clamp(22px,3.6vw,34px);line-height:1.1;font-weight:700;text-transform:uppercase}.rt p{font-size:12px;margin-top:8px;opacity:.9}
.fb{position:absolute;padding:7px 13px;border-radius:14px 14px 4px 14px;background:rgba(255,255,255,.15);backdrop-filter:blur(6px);font-size:11.5px;color:#fff;animation:fl 4s ease-in-out infinite;white-space:nowrap}
@keyframes fl{50%{transform:perspective(500px) translate3d(0,-10px,40px) rotateY(-12deg)}}
@media(max-width:720px){#card{height:auto;display:flex;flex-direction:column}.rpw{position:relative;order:-1;height:190px;inset:auto}.rp{clip-path:polygon(0 0,100% 0,100% 80%,0 100%)}.rt{width:60%;top:46%}.lp{position:relative;width:100%;padding:18px 28px 34px}}

#app{position:fixed;inset:0;display:flex;background:var(--bg);animation:appIn .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes appIn{from{opacity:0;transform:perspective(1200px) rotateX(6deg) scale(.97)}}
#side{width:370px;background:var(--pn);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;flex-shrink:0}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.hd{height:66px;padding:0 14px;display:flex;align-items:center;gap:12px;background:var(--pn);border-bottom:1px solid var(--bd);flex-shrink:0}
.hd .nm{min-width:0;flex:1;cursor:pointer}.hd .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.on-d{display:inline-block;width:7px;height:7px;border-radius:50%;background:#10b981;margin-right:5px;box-shadow:0 0 8px #10b981}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;width:100%;text-align:left;transition:.25s;animation:fadeUp .45s both}
.row:hover{background:var(--pn2);transform:translateX(5px)}.row .nm{min-width:0;flex:1}.row .nm b,.row .nm small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ud{width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
#chats{flex:1;overflow-y:auto;padding:0 8px 8px;min-height:0}
.empty{text-align:center;color:var(--mu);font-size:13px;padding:30px}
@media(max-width:767px){#side{width:100%}#main{position:absolute;inset:0;z-index:5;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.9,.3,1)}#app.open #main{transform:none}}
#emp{margin:auto;text-align:center;color:var(--mu);padding:20px}
.cube{width:90px;height:90px;margin:0 auto 50px;transform-style:preserve-3d;animation:cs 14s linear infinite}
@keyframes cs{to{transform:rotateX(360deg) rotateY(360deg)}}
.cube i{position:absolute;inset:0;border:1.5px solid var(--ac);background:rgba(0,242,254,.08);box-shadow:inset 0 0 24px -8px var(--ac)}
.cube i:nth-child(1){transform:translateZ(45px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(45px)}.cube i:nth-child(3){transform:rotateY(90deg) translateZ(45px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(45px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(45px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(45px)}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow-y:auto;padding:16px 5%;display:flex;flex-direction:column;gap:6px;min-height:0;overscroll-behavior:contain;scroll-behavior:smooth;background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:26px 26px}
.mw{display:flex;flex-direction:column}.mr{display:flex}.mr.me{justify-content:flex-end}
.dp{align-self:center;font-size:11px;padding:3px 12px;border-radius:99px;background:var(--pn2);color:var(--mu);border:1px solid var(--bd);margin:8px 0}
.bub{position:relative;max-width:min(80%,520px);padding:9px 14px 5px;border-radius:18px 18px 18px 5px;background:var(--in);border:1px solid var(--bd);word-break:break-word;white-space:pre-wrap;box-shadow:0 8px 20px -14px #000}
.me .bub{border-radius:18px 18px 5px 18px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ink);border-color:transparent;box-shadow:0 8px 26px -10px var(--ac)}
.bub a{color:inherit;text-decoration:underline}.bub img,.bub video,.bub audio{border-radius:12px;max-height:280px;max-width:100%;display:block;cursor:pointer;margin:4px 0}
.tm{font-size:10px;opacity:.65;text-align:right;margin-top:2px}
.q{border-left:3px solid var(--ac);padding:3px 8px;margin-bottom:5px;background:rgba(0,0,0,.18);border-radius:6px;font-size:12px;opacity:.9}.me .q{border-color:var(--ink)}
.q b{display:block;font-size:11px}
.fl{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.12);border-radius:12px;padding:8px 10px;min-width:190px}
.act{position:absolute;top:-17px;right:8px;display:flex;opacity:0;pointer-events:none;transition:.2s;background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:2px;white-space:normal}
.act button{padding:4px 6px}.act svg{width:15px;height:15px}.act button:hover{color:var(--ac)}.bub.sel .act,.bub:hover .act{opacity:1;pointer-events:auto}
.reactions{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}.react-badge{font-size:11px;background:rgba(0,0,0,.25);padding:2px 6px;border-radius:99px;border:1px solid var(--bd)}
.ent{animation:fadeUp .5s both}
@keyframes flyL{0%{opacity:0;transform:perspective(900px) translate3d(-80px,60px,-520px) rotateY(50deg) rotateX(-25deg) scale(.6)}65%{opacity:1;transform:perspective(900px) translate3d(6px,-8px,50px) rotateY(-5deg) rotateX(3deg) scale(1.05)}100%{opacity:1;transform:perspective(900px)}}
@keyframes flyR{0%{opacity:0;transform:perspective(900px) translate3d(80px,60px,-520px) rotateY(-50deg) rotateX(-25deg) scale(.6)}65%{opacity:1;transform:perspective(900px) translate3d(-6px,-8px,50px) rotateY(5deg) rotateX(3deg) scale(1.05)}100%{opacity:1;transform:perspective(900px)}}
@keyframes ring{from{box-shadow:0 0 0 0 var(--ac)}to{box-shadow:0 0 0 24px transparent}}
.f3l .bub{transform-origin:0 100%;animation:flyL .85s cubic-bezier(.2,.8,.2,1) both,ring 1.2s .55s ease-out}
.f3r .bub{transform-origin:100% 100%;animation:flyR .7s cubic-bezier(.2,.8,.2,1) both}
.no3d .f3l .bub,.no3d .f3r .bub{animation:fadeUp .3s both}.no3d *{animation-duration:.01s!important}
@media(prefers-reduced-motion:reduce){.f3l .bub,.f3r .bub{animation:fadeUp .3s both}}
#dn{position:absolute;right:18px;bottom:84px;z-index:4;transition:.3s}#dn.h{display:grid!important;opacity:0;transform:scale(.4);pointer-events:none}
#prog{height:3px;background:var(--pn2)}#bar{height:3px;width:0;background:var(--ac);box-shadow:0 0 10px var(--ac);transition:width .2s}
#rb{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--pn);border-top:1px solid var(--bd);animation:fadeUp .25s}#rb div{flex:1;min-width:0;border-left:3px solid var(--ac);padding-left:8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;gap:8px;padding:10px 12px;background:var(--pn);border-top:1px solid var(--bd);align-items:center;position:relative;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.sd{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ink);box-shadow:0 0 20px -4px var(--ac);transition:.25s;flex-shrink:0}.sd:hover{transform:scale(1.1) rotate(-12deg)}.sd:active{transform:scale(.88)}
.mn{position:absolute;bottom:70px;left:12px;background:var(--pn);border:1px solid var(--bd);border-radius:18px;padding:8px;z-index:6;animation:pop .35s cubic-bezier(.3,1.5,.5,1) both;transform-origin:bottom left;box-shadow:0 20px 50px -20px #000}
#emenu{display:flex;flex-wrap:wrap;gap:2px;width:268px}#emenu button{width:40px;height:40px;font-size:21px;border-radius:10px;transition:.15s}#emenu button:hover{background:var(--pn2);transform:scale(1.25)}
#amenu button{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;width:100%;font-size:13px}#amenu button:hover{background:var(--pn2);color:var(--ac)}

#sp,#pp{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;transform:perspective(1500px) translateX(105%) rotateY(-30deg);transform-origin:100% 50%;opacity:0;visibility:hidden;transition:transform .65s cubic-bezier(.2,.9,.3,1),opacity .4s,visibility 0s .65s}
#sp.on,#pp.on{transform:none;opacity:1;visibility:visible;transition-delay:0s}
.wrap{max-width:640px;margin:auto;padding:0 16px 60px}.sbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:14px 0;background:var(--bg)}.sbar h2{font-size:22px}
.pc{display:flex;gap:16px;align-items:center;padding:18px;border-radius:22px;background:linear-gradient(135deg,var(--pn2),var(--pn));border:1px solid var(--bd)}.pc .av{width:62px;height:62px}
.acc{background:var(--pn);border:1px solid var(--bd);border-radius:20px;margin:12px 0;overflow:hidden;transition:.4s}.acc.o{border-color:var(--ac);box-shadow:0 0 28px -12px var(--ac)}
#sp.on .acc,#sp.on .pc,#pp.on .acc,#pp.on .pc{animation:pop .7s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d,0ms)}
.ah{display:flex;align-items:center;gap:12px;padding:16px;width:100%;font-weight:600;text-align:left}.ah .ci{width:38px;height:38px;border-radius:12px;background:var(--pn2);color:var(--ac);display:grid;place-items:center}.ah>span{flex:1}.ah small{font-weight:400}
.ah .ch{transition:transform .5s cubic-bezier(.3,1.5,.5,1)}.acc.o .ch{transform:rotate(180deg);color:var(--ac)}
.bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.9,.3,1)}.acc.o .bd{grid-template-rows:1fr}.bd>div{overflow:hidden}.bi{padding:0 16px 14px}
.st{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}.st>div:first-child{min-width:0}
.sw{width:48px;height:27px;border-radius:99px;background:var(--pn2);border:1px solid var(--bd);position:relative;transition:.3s;flex-shrink:0}.sw::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--mu);transition:.4s cubic-bezier(.3,1.6,.5,1)}
.sw.on{background:var(--ac);border-color:var(--ac);box-shadow:0 0 14px -2px var(--ac)}.sw.on::after{transform:translateX(21px);background:var(--ink)}
.opts{display:flex;gap:10px;flex-wrap:wrap}.tb{flex:1;min-width:90px;padding:12px;border-radius:14px;border:1px solid var(--bd);background:var(--pn2);font-size:13px;transition:.3s}.tb.on{border-color:var(--ac);color:var(--ac);box-shadow:0 0 18px -6px var(--ac);transform:translateY(-3px)}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid transparent;transition:.3s}.dot.on{border-color:var(--tx);transform:scale(1.18)}
.bi input[type=range]{width:100%;accent-color:var(--ac)}.bi .inp{margin:6px 0 10px;border-radius:14px}.bi .pr,.bi .tb{margin-top:8px}.dg{color:#ff5252}
.mc{background:var(--pn);color:var(--tx);border:1px solid var(--ac);box-shadow:0 0 40px -10px var(--ac);border-radius:24px;max-height:92vh;overflow:auto;animation:pop .5s cubic-bezier(.2,.9,.3,1) both;padding:22px;width:92vw;max-width:420px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,10,16,.6);display:grid;place-items:center;backdrop-filter:blur(6px)}
#toast{position:fixed;bottom:28px;left:50%;z-index:90;background:var(--pn);border:1px solid var(--ac);border-radius:99px;padding:10px 20px;font-size:13px;box-shadow:0 0 24px -6px var(--ac);transform:translate(-50%,40px);opacity:0;pointer-events:none;transition:.4s cubic-bezier(.3,1.5,.5,1);max-width:90vw}#toast.on{transform:translate(-50%,0);opacity:1}
#nt{position:fixed;top:14px;left:50%;z-index:95;width:min(380px,92vw);display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--pn);border:1px solid var(--ac);border-radius:20px;box-shadow:0 0 36px -8px var(--ac);transform:translateX(-50%) perspective(700px) translateY(-140%) rotateX(-75deg);transform-origin:top;opacity:0;transition:.7s cubic-bezier(.2,1.2,.3,1);cursor:pointer}
#nt.on{transform:translateX(-50%) perspective(700px);opacity:1}#nt div{min-width:0}#nt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table{width:100%;font-size:12px;border-collapse:collapse}td,th{padding:7px 4px;text-align:left;border-top:1px solid var(--bd)}
/* ===== ANIMATION & DESIGN UPGRADES ===== */
#card{border:1.5px solid transparent;background:linear-gradient(var(--cardbg),var(--cardbg)) padding-box,linear-gradient(120deg,var(--ac),#4facfe,#a78bfa,#22d3ee,var(--ac)) border-box;background-size:100% 100%,300% 300%;animation:borderflow 7s linear infinite}
@keyframes borderflow{to{background-position:0 0,300% 0}}
.pr::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:shine3 3s ease-in-out infinite}
@keyframes shine3{0%{left:-60%}55%,100%{left:130%}}
.sd{animation:sdpulse 2.4s ease-in-out infinite}
@keyframes sdpulse{50%{box-shadow:0 0 34px -2px var(--ac);transform:scale(1.06)}}
.react-badge{animation:reactpop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes reactpop{from{transform:scale(.3);opacity:0}}
.row:active{transform:scale(.98)}
.bub{transition:transform .2s,box-shadow .2s}
.bub:hover{transform:translateY(-2px)}
#nt.on{animation:ntglow 2s ease-in-out infinite}
@keyframes ntglow{50%{box-shadow:0 0 52px -6px var(--ac)}}
.lp h2{background:linear-gradient(120deg,var(--ac),var(--ac2),var(--ac));background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine3b 4s linear infinite}
@keyframes shine3b{to{background-position:200% center}}
.av{transition:transform .25s}
.av:hover{transform:scale(1.06) rotate(3deg)}

html,body{overscroll-behavior:none;-webkit-touch-callout:none;touch-action:manipulation}
button,.hd,#side,#sp,#stories{user-select:none;-webkit-user-select:none}
#msgs,#chats,#sp,.mc,#stories,.tbox{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.bub{user-select:text;-webkit-user-select:text}
.hf{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.row{animation:none;content-visibility:auto;contain-intrinsic-size:64px}

 if(x.type==='video'){const v=c.firstChild;v.onended=next;v.ontimeupdate=()=>{if(v.duration)bar.style.width=v.currentTime/v.duration*100+'%'};v.onerror=()=>{sv.t=setTimeout(next,2500)}}
 else{bar.style.transition='width 5s linear';requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width='100%'));sv.t=setTimeout(next,5000)}}
$('svx').onclick=()=>closeStories();
$('svl').onclick=()=>{if(sv.i>0)sv.i--;showStory()};
$('svr').onclick=()=>{if(sv.i<sv.l.length-1){sv.i++;showStory()}else closeStories()};
$('svd').onclick=async()=>{const x=sv.l[sv.i];if(!x||!confirm('Delete this status?'))return;clearTimeout(sv.t);await deleteDoc(doc(db,'stories',x.id)).catch(()=>toast('Delete failed'));
 ['pub','prv','own'].forEach(k=>SM[k].delete(x.id));sv.l.splice(sv.i,1);if(!sv.l.length)closeStories();else{if(sv.i>=sv.l.length)sv.i=sv.l.length-1;showStory()}};


/* ===== profile / contact info page ===== */
const swrp=(k,t,sub,on)=>`<div class="st"><div><b>${t}</b><small>${sub}</small></div><button class="sw ${on?'on':''}" data-pk="${k}"></button></div>`;
const acc=t=>{const a=t.parentElement,o=a.classList.contains('o');a.parentElement.querySelectorAll('.acc.o').forEach(x=>x.classList.remove('o'));if(!o)a.classList.add('o')};
function closePP(){$('pp').classList.remove('on');vdrop('pp')}
function applyChatBg(c){const m=$('msgs'),b=c.customBg||S.customBg;m.style.backgroundImage=b?`url(${b})`:'';m.style.backgroundSize=b?'cover':''}
function openProfilePage(){if(!cur)return;const c=cur,g=c.isGroup,p=c.peer,id=c.id,bl=!g&&myBlocked.has(p.uid),pp=$('pp'),isA=(lastRows.find(r=>r.id===id)||{}).isArchived;
 const pic=g?(p.groupPhoto||avatar({name:p.groupName})):avatar(p);
 const med=(c.lastDocs||[]).map(d=>({id:d.id,...d.data()})).filter(m=>(m.type==='image'||m.type==='video')&&m.url&&!(CLR[id]&&m.ts&&m.ts.toMillis&&m.ts.toMillis()<=CLR[id])).reverse().slice(0,18);
 const gal=med.length?`<div class="gal">${med.map(m=>m.type==='image'?`<img src="${esc(m.url)}" data-img="${esc(m.url)}" loading="lazy">`:`<div class="vd">${ic('image')}</div>`).join('')}</div>`:'<small>No photos or videos yet.</small>';
 pp.innerHTML=`<div class="wrap"><div class="sbar"><button class="ib" data-p="back">${ic('back')}</button><h2>${g?'Group info':'Contact info'}</h2></div>
 <div class="pc" style="flex-direction:column;text-align:center"><img class="av" data-img="${esc(pic)}" src="${esc(pic)}" style="width:96px;height:96px;cursor:pointer"><div><h3 style="font-size:24px">${esc(g?p.groupName:nm(p))}</h3>${g?`<small>${p.members.length} members</small>`:`<small style="color:var(--ac)">@${esc(p.username||'')}</small><p style="font-size:13px;color:var(--mu);margin-top:8px">${esc(p.about||'Hey there! I am using abchat.')}</p>`}</div></div>
 ${g?'':sec(0,'edit','Nickname','Only you can see it',`<input id="nk" class="inp" placeholder="${esc(p.name||p.username||'Nickname')}" value="${esc(NICK[p.uid]||'')}" maxlength="30"><button class="pr" data-p="nick">Save nickname</button>`)}
 ${sec(1,'lock','Chat settings','Mute, pin, lock, disappearing',swrp('mute','Mute notifications','No sound or pop-up from this chat',MUTE.has(id))+swrp('pin','Pin chat','Keep it on top of your list',PIN_.has(id))+`<div class="st"><div><b>Chat lock</b><small>${LOCK[id]?'Opens only with your PIN':'Ask for a PIN to open this chat'}</small></div><button class="tb" data-p="lock" style="flex:none;min-width:0;margin:0;padding:8px 14px">${LOCK[id]?'Remove':'Set PIN'}</button></div><small style="margin:10px 0 6px">Disappearing messages</small><div class="opts">${[[0,'Off'],[10,'10s'],[3600,'1h'],[86400,'24h']].map(([v,n])=>`<button class="tb ${(c.disappear||0)===v?'on':''}" data-d="${v}">${n}</button>`).join('')}</div>`)}
 ${sec(2,'image','Media','Photos and videos in this chat',gal)}
 ${sec(3,'palette','Wallpaper','For this chat only',`<button class="tb" data-p="wp">Choose wallpaper</button><button class="tb" data-p="wpx">Reset wallpaper</button>`)}
 ${g?sec(4,'users','Members','People in this group','<div id="mlist"><small>Loading…</small></div>'):''}
 ${sec(5,'shield','Manage chat','Archive, clear, delete, block',`<button class="tb" data-p="arc">${isA?'Unarchive':'Archive'} chat</button><button class="tb" data-p="clear">Clear chat</button><button class="tb dg" data-p="del">Delete chat</button>${g?'':`<button class="tb ${bl?'':'dg'}" data-p="blk">${bl?'Unblock':'Block'} user</button><button class="tb" data-p="rep">Report user</button>`}`)}</div>`;
 if(g)Promise.all(p.members.map(getUser)).then(us=>{const l=$('mlist');if(l)l.innerHTML=us.map(u=>`<div class="st"><div style="display:flex;gap:10px;align-items:center"><img class="av" style="width:36px;height:36px" src="${esc(avatar(u))}"><div><b>${esc(u.uid===me.uid?'You':nm(u))}</b><small>@${esc(u.username||'')}</small></div></div></div>`).join('')});
 requestAnimationFrame(()=>pp.classList.add('on'));vpush('pp',closePP)}
$('pp').onclick=async e=>{const t=e.target.closest('.ah,[data-p],[data-pk],[data-d],[data-img]');if(!t||!cur)return;const c=cur,id=c.id;
 if(t.classList.contains('ah'))return acc(t);
 if(t.dataset.img)return modal(`<img src="${esc(t.dataset.img)}" style="max-width:100%;max-height:80vh;border-radius:14px;display:block;margin:auto">`);
 if(t.dataset.pk){const mu=t.dataset.pk==='mute',st=mu?MUTE:PIN_;st.has(id)?st.delete(id):st.add(id);lsSet(mu?'abchat_mute':'abchat_pin',[...st]);t.classList.toggle('on',st.has(id));paintChats(lastRows);return}
 if(t.dataset.d!==undefined){const v=+t.dataset.d;try{await updateDoc(doc(db,'chats',id),{disappear:v});c.disappear=v;t.parentElement.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b===t));toast('Timer updated')}catch{toast('Could not update timer')}return}
 const a=t.dataset.p;
 if(a==='back')closePP();
 if(a==='nick'){const v=$('nk').value.trim();v?NICK[c.peer.uid]=v:delete NICK[c.peer.uid];lsSet('abchat_nick',NICK);$('pname').textContent=nm(c.peer);paintChats(lastRows);toast('Nickname saved')}
 if(a==='lock'){LOCK[id]?askPin(id,'Enter PIN to remove lock',()=>{delete LOCK[id];lsSet('abchat_lock',LOCK);toast('Chat lock removed');openProfilePage();paintChats(lastRows)}):askPin(id,'Set a PIN for this chat',()=>{toast('Chat locked');openProfilePage();paintChats(lastRows)},true)}
 if(a==='wp'){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.className='hf';document.body.appendChild(inp);inp.onchange=async ev=>{const f=ev.target.files[0];if(f){const url=(await scaled(f,1280,.7)).url;try{await updateDoc(doc(db,'chats',id),{customBg:url})}catch{}c.customBg=url;applyChatBg(c);toast('Wallpaper set')}inp.remove()};inp.click()}
 if(a==='wpx'){try{await updateDoc(doc(db,'chats',id),{customBg:''})}catch{}c.customBg='';applyChatBg(c);toast('Wallpaper reset')}
 if(a==='arc'){const isA=(lastRows.find(r=>r.id===id)||{}).isArchived;try{await updateDoc(doc(db,'chats',id),{[`archivedBy.${me.uid}`]:!isA});toast(isA?'Chat unarchived':'Chat archived');closeChat()}catch{toast('Archive failed')}}
 if(a==='clear'){if(!confirm('Clear all messages in this chat on this device?'))return;CLR[id]=Date.now();lsSet('abchat_clr',CLR);c.els.clear();$('msgs').innerHTML='';c.init=false;render(c,c.lastDocs||[]);toast('Chat cleared');closePP()}
 if(a==='del'){if(!confirm('Delete this chat? It comes back only when a new message arrives.'))return;CLR[id]=HID[id]=Date.now();lsSet('abchat_clr',CLR);lsSet('abchat_hid',HID);closeChat();paintChats(lastRows);toast('Chat deleted')}
 if(a==='blk'){const bl=myBlocked.has(c.peer.uid);await setBlock(c.peer.uid,!bl);toast(bl?'User unblocked':'User blocked');openProfilePage()}
 if(a==='rep'){const p=c.peer;location.href=`mailto:${SUP_EMAIL}?subject=${encodeURIComponent('abchat user report')}&body=${encodeURIComponent('Reporting: @'+(p.username||'')+' (UID: '+p.uid+')\nReporter: '+(me.email||'')+'\nReason: ')}`}};
(function(){const c=$('fx');if(!c)return;const x=c.getContext('2d'),P=[];let W,H,mx=0,my=0;const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
 for(let i=0;i<120;i++)P.push({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()});
 const loginEl=$('login');
 if(loginEl){loginEl.addEventListener('pointermove',e=>{mx=e.clientX/W-.5;my=e.clientY/H-.5;const card=$('card');if(S.fx3d&&innerWidth>720&&card)card.style.transform=`rotateY(${mx*14}deg) rotateX(${-my*12}deg)`})}
 (function f(){!loginEl||loginEl.classList.contains('h')||document.hidden||(x.clearRect(0,0,W,H),x.fillStyle=accol,P.forEach(p=>{S.fx3d&&(p.z-=.0035),p.z<=.02&&(p.z=1,p.x=Math.random()*2-1,p.y=Math.random()*2-1);const k=.45/p.z,sx=W/2+(p.x-mx*.3)*W*k*.5,sy=H/2+(p.y-my*.3)*H*k*.5;x.globalAlpha=Math.min(1,(1-p.z)*1.2),x.beginPath(),x.arc(sx,sy,(1-p.z)*2.6+.4,0,6.3),x.fill()}),x.globalAlpha=1),requestAnimationFrame(f)})()})();
</script></body></html>
