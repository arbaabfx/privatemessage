async function render(c,docs){const tok=++tokR,items=[];

  if(!el){let body;

   el.innerHTML=`${dl!==day?`<div class="dp">${dl}</div>`:''}<div class="mr ${mine?'me':''} ${cls}"><div class="bub">${body}<div class="reactions">${reactHtml}</div><div class="tm">${tm}</div><div class="act"><button data-a="r">${ic('reply')}</button><button data-a="react">👍</button>${m.type==='text'||!m.type?`<button data-a="c">${ic('copy')}</button>`:''}${mine?`<button data-a="d">${ic('trash')}</button>`:''}</div></div></div>`;
   if(!fresh)el.style.animationDelay=(i-Math.max(0,items.length-10))*35+'ms';
   c.els.set(id,el);c.txt.set(id,{n:mine?'You':(c.isGroup?'Member':nm(c.peer)),t:m.type==='image'?'Photo':m.type==='video'?'Video':m.type==='audio'?'Voice Note':m.type==='file'?(x.n||'File'):x.t.slice(0,90),raw:x.t})}
  else{const t=el.querySelector('.tm');if(t&&t.textContent!==tm)t.textContent=tm}
  day=dl;const want=prev?prev.nextSibling:box.firstChild;if(el!==want)box.insertBefore(el,want);prev=el});
