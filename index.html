<input type="file" id="rf" accept=".json,application/json" class="hf">
<script>
(()=>{
const $=s=>document.querySelector(s);
const N=new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}),R=n=>'₹'+N.format(Math.round((+n||0)*100)/100);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:0};
const KEY='dukaan_saathi_v1',AK=KEY+'_arch',DAY=864e5,TEN=30*DAY,STORE=/^#s=/.test(location.hash);
const def=()=>({shop:{name:'',owner:'',phone:'',gstin:'',addr:'',upi:'',footer:'Thank you! Visit again.',gst:0,paper:'80',pin:''},items:[],cust:[],bills:[],exp:[],pay:[],seq:1,id:1,bk:0,seen:0,quick:{}});
let D;try{D=Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||'{}'));D.shop=Object.assign(def().shop,D.shop)}catch{D=def()}
let ARCH=[];try{ARCH=JSON.parse(localStorage.getItem(AK)||'[]');if(!Array.isArray(ARCH))ARCH=[]}catch{ARCH=[]}
function saveArch(){try{localStorage.setItem(AK,JSON.stringify(ARCH));return true}catch{toast('Backup storage is full! Save a backup file now.');return false}}
const allB=()=>[...ARCH,...D.bills].sort((a,b)=>a.ts-b.ts),fb=id=>D.bills.find(x=>x.id===id)||ARCH.find(x=>x.id===id);
/* bills older than 24h -> auto backup on phone; backup older than 30 days -> deleted */
function rotate(){const now=Date.now(),old=D.bills.filter(b=>b.ts<now-DAY),keep=ARCH.filter(b=>b.ts>=now-30*DAY);if(!old.length&&keep.length===ARCH.length)return false;
 const prev=ARCH;ARCH=keep.concat(old).filter(b=>b.ts>=now-30*DAY);if(!saveArch()){ARCH=prev;return false}
 D.bills=D.bills.filter(b=>b.ts>=now-DAY);save();return true}
let st;const flush=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch{toast('Phone storage is full! Take a backup now.')}};
const save=()=>{clearTimeout(st);st=setTimeout(flush,200)};addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden){flush();hiddenAt=Date.now()}else{if(!STORE&&D.shop.pin&&Date.now()-hiddenAt>60000)lockUI();if(rotate()&&cur==='home')go('home');setTimeout(backupCheck,800)}});
let hiddenAt=0;
const uid=()=>D.id++,day0=(d=Date.now())=>{const x=new Date(d);x.setHours(0,0,0,0);return+x};

const b64u=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u};
async function enc(o){const b=new TextEncoder().encode(JSON.stringify(o));if(window.CompressionStream){try{const z=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());return'z'+b64u(z)}catch{}}return'p'+b64u(b)}
async function dec(h){let u=ub64(h.slice(1));if(h[0]==='z')u=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());return JSON.parse(new TextDecoder().decode(u))}

 }

const AI_SYS=`You are "Saathi AI", the friendly assistant inside the app "Dukaan Saathi" used by small Indian shopkeepers (kirana, medical, general stores).
LANGUAGE: reply in the user's language. Default Hinglish (Hindi in Roman script). If the user writes Devanagari Hindi, reply in Hindi; if English, reply in English.

APP GUIDE: Bottom tabs = Home (aaj ki bikri, munafa, udhaar, kam stock), Items (saman add/edit, barcode scan, GST %, expiry, low-stock level), Naya Bill (item search/scan, discount, payment Cash/UPI/Card/Udhaar, bill share on WhatsApp/print), Khata (customers, udhaar, "Receive" payment, WhatsApp reminder), More (Reports, All Bills, Expenses, Settings, Backup/Restore, Help). Settings: shop name, owner, phone, GSTIN, UPI ID, GST on/off, paper size, 4-digit PIN lock. Data is stored on the phone only; bills older than 24h are auto-archived for 30 days; take a backup file every 30 days. The app also has an online dukaan (store link) where customers can order via WhatsApp. If unsure of an exact menu, say "More tab mein dekhiye".`;
function aiCtx(){const T=day0(),B=allB(),tb=B.filter(b=>b.ts>=T),m0=new Date();m0.setDate(1);const M=day0(+m0),mb=B.filter(b=>b.ts>=M),
 due=D.cust.filter(c=>c.bal>0).sort((a,b)=>b.bal-a.bal),low=D.items.filter(i=>i.stock<=i.low),soon=D.items.filter(i=>i.exp&&(new Date(i.exp)-Date.now())/864e5<=15),
 qm={};B.filter(b=>b.ts>=Date.now()-30*DAY).forEach(b=>b.items.forEach(i=>qm[i.name]=(qm[i.name]||0)+i.qty));
 const top=Object.entries(qm).sort((a,b)=>b[1]-a[1]).slice(0,6),ex=D.exp.filter(e=>e.ts>=M),ec={};ex.forEach(e=>ec[e.cat]=(ec[e.cat]||0)+e.amt);const s=D.shop;
 return `SHOP DATA (${new Date().toLocaleString('en-IN')}):
Shop: ${s.name||'(naam set nahi)'}; GST billing ${s.gst?'ON':'OFF'}; PIN ${s.pin?'set':'not set'}; total items ${D.items.length}

Is mahine: ${mb.length} bills, bikri ${R(sum(mb,'total'))}, munafa ${R(sum(mb,bprofit))}, kharcha ${R(sum(ex,'amt'))}${Object.keys(ec).length?' ('+Object.entries(ec).map(([k,v])=>k+' '+R(v)).join(', ')+')':''}
Udhaar total ${R(sum(due,'bal'))} (${due.length} customers): ${due.slice(0,8).map((c,i)=>(aiNames?c.name:'Customer '+(i+1))+' '+R(c.bal)).join(', ')||'koi nahi'}
Kam stock: ${low.slice(0,15).map(i=>i.name+' ('+i.stock+' '+(i.unit||'')+')').join(', ')||'koi nahi'}
Expiry 15 din mein: ${soon.slice(0,10).map(i=>i.name+' '+i.exp).join(', ')||'koi nahi'}
Top bikne wale (30 din): ${top.map(([n,q])=>n+' x'+q).join(', ')||'data nahi'}`}
async function aiCall(contents){
 const apiKey=AI.getKey();
 if(!apiKey)throw new Error('Gemini API key nahi mili. Chatbot use karne ke liye key zaroori hai.');
 const models=['gemini-3.8-flash','gemini-3.5-flash-lite'];
 const body={systemInstruction:{parts:[{text:AI_SYS+'\n\n'+aiCtx()}]},contents,generationConfig:{temperature:.6,maxOutputTokens:900}};
 let last503='';
 for(let i=0;i<models.length;i++){
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+models[i]+':generateContent';
  let r;
  try{r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},body:JSON.stringify(body)})}
  catch{throw new Error('Internet nahi hai ya network block hai 📶 Check karke phir try kijiye.')}
  let j;
  try{j=await r.json()}catch{throw new Error('AI server se valid jawab nahi mila. Thodi der baad try kijiye.')}
  if(!r.ok||j.error){
   const c=Number(j.error?.code||r.status||0),msg=String(j.error?.message||'');
   if(c===400&&/API_KEY_INVALID|API key not valid|invalid.*key/i.test(msg)){try{localStorage.removeItem('ds_gemini_key')}catch{};throw new Error('Gemini API key galat ya invalid hai. Page refresh karke dobara sahi API key daaliye. Key Google AI Studio se banayein.')}
   if(c===401||c===403){
    const detail=msg.toLowerCase();
    if(/api key not valid|api_key_invalid|key.*invalid|referer|referrer|api.*not.*enabled|service.*disabled|permission_denied|access.*denied|blocked/i.test(detail)){
     try{localStorage.removeItem('ds_gemini_key')}catch{}
     throw new Error('Gemini API access reject hua. Google AI Studio mein key check karein. Google Cloud mein Generative Language API enabled ho aur API key ki website/referrer restriction GitHub Pages ko block na kar rahi ho. Details: '+msg)
    }
    throw new Error('Gemini permission error ('+c+'): '+(msg||'API key aur Gemini API access check karein.')+' Google AI Studio mein key check karein.')
   }
   if(c===404){
    if(i<models.length-1)continue;
    throw new Error('Gemini model/API nahi mila: '+(msg||'Model availability check kijiye.'))
   }
   if(c===503&&i<models.length-1){last503=msg;continue}
   if(c===503)throw new Error('Gemini ke dono available models abhi busy hain (503). Thodi der baad dobara try kijiye. '+(msg||''))
   if(c===429)throw new Error('Gemini ki request limit ya quota poori hai. Google AI Studio mein quota check karke baad mein try karein 🙏')
   throw new Error('Gemini error ('+c+'): '+(msg||'Thodi der baad try kijiye.'))
  }
  const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
  if(!t)throw new Error('AI ne jawab nahi diya. Sawal thoda alag tareeke se poochiye.');
  return t;
 }
 throw new Error('Gemini ke models abhi available nahi hain. '+last503+' Thodi der baad try kijiye.')
}
